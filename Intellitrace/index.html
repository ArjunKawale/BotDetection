<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Intellitrace | Multi-Model Analysis</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ========== DESIGN SYSTEM ========== */
:root {
  /* Dark theme (default) */
  --bg-primary: #0a0c12;
  --bg-secondary: #11131c;
  --bg-tertiary: #181c2a;
  --border: #232738;
  --border-light: #2d3247;
  --text-primary: #eef2ff;
  --text-secondary: #9ca3c7;
  --text-muted: #5f6a8a;
  --accent: #6366f1;
  --accent-hover: #8183f4;
  --accent-glow: rgba(99,102,241,0.2);
  --success: #10b981;
  --error: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  --surface: #0f1119;
  --card: #131724;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.2s ease;
}

[data-theme="light"] {
  --bg-primary: #f3f4f8;
  --bg-secondary: #ffffff;
  --bg-tertiary: #eef2f6;
  --border: #e0e4ec;
  --border-light: #d1d6e2;
  --text-primary: #1a1f36;
  --text-secondary: #4a536e;
  --text-muted: #8b94b0;
  --accent: #4f46e5;
  --accent-hover: #6366f1;
  --accent-glow: rgba(79,70,229,0.1);
  --surface: #ffffff;
  --card: #ffffff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  transition: background 0.25s ease, color 0.2s ease;
}

/* ========== TITLEBAR ========== */
#titlebar {
  -webkit-app-region: drag;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 48px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  overflow: hidden;
}
.intelli-trace-img{
  width: 16px;
  height: 16px;
  object-fit: cover;
}
.brand-text {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.2px;
}
.brand-text span {
  color: var(--accent);
}

.window-controls {
  -webkit-app-region: no-drag;
  display: flex;
  gap: 8px;
}
.win-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: none;
  background: var(--bg-tertiary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.win-btn svg {
  width: 12px;
  height: 12px;
  stroke: var(--text-secondary);
}
.win-btn:hover {
  background: var(--border);
}
.win-btn.close:hover {
  background: var(--error);
}
.win-btn.close:hover svg {
  stroke: white;
}

/* ========== MAIN LAYOUT ========== */
#app {
  display: flex;
  height: calc(100vh - 48px);
  overflow: hidden;
}

/* ========== SIDEBAR ========== */
#sidebar {
  width: 280px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-content {
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  flex: 1;
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.input-group {
  position: relative;
  margin-bottom: 12px;
}
.input-prefix {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
}
#username-input {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 12px 12px 34px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: var(--transition);
}
#username-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

#scan-btn {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 13px;
  color: white;
  cursor: pointer;
  transition: var(--transition);
}
#scan-btn:hover:not(:disabled) {
  background: var(--accent-hover);
  transform: translateY(-1px);
}
#scan-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Pipeline stages */
.pipeline-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pipeline-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.pipeline-item.active {
  border-color: var(--accent);
  background: var(--accent-glow);
}
.pipeline-item.done {
  border-color: var(--success);
  background: rgba(16,185,129,0.08);
}
.pipeline-item.error {
  border-color: var(--error);
  background: rgba(239,68,68,0.08);
}
.pipeline-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
}
.pipeline-item.active .pipeline-num {
  background: var(--accent);
  color: white;
}
.pipeline-item.done .pipeline-num {
  background: var(--success);
  color: white;
}
.pipeline-item.error .pipeline-num {
  background: var(--error);
  color: white;
}
.pipeline-name {
  flex: 1;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}
.pipeline-item.active .pipeline-name {
  color: var(--accent);
}
.pipeline-item.done .pipeline-name {
  color: var(--success);
}
.pipeline-spinner {
  width: 14px;
  height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
.pipeline-item.active .pipeline-spinner {
  display: block;
}

.sidebar-footer {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.footer-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: none;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}
.footer-btn:hover {
  border-color: var(--border-light);
  background: var(--bg-tertiary);
  color: var(--text-primary);
}
.footer-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
}

/* ========== MAIN CONTENT ========== */
#main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Empty state */
#empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.empty-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}
.empty-title {
  font-size: 20px;
  font-weight: 700;
}
.empty-desc {
  font-size: 13px;
  color: var(--text-secondary);
  max-width: 320px;
  text-align: center;
}

/* Log panel */
#log-panel {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px;
  display: none;
  flex-direction: column;
  gap: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
#log-panel.visible {
  display: flex;
}
.log-entry {
  display: flex;
  gap: 14px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.log-time {
  color: var(--text-muted);
  flex-shrink: 0;
}
.log-level {
  flex-shrink: 0;
  padding: 0 6px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 700;
}
.level-info { background: rgba(59,130,246,0.15); color: var(--info); }
.level-ok { background: rgba(16,185,129,0.15); color: var(--success); }
.level-warn { background: rgba(245,158,11,0.15); color: var(--warning); }
.level-err { background: rgba(239,68,68,0.15); color: var(--error); }
.log-message { color: var(--text-secondary); }

/* Result panel */
#result-panel {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  display: none;
  flex-direction: column;
  gap: 24px;
}
#result-panel.visible {
  display: flex;
}

/* Tabs */
.tab-bar {
  display: flex;
  gap: 4px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
}
.tab {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: none;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}
.tab.active {
  background: var(--accent);
  color: white;
}
.tab-pane {
  display: none;
  flex-direction: column;
  gap: 20px;
}
.tab-pane.active {
  display: flex;
}

/* Verdict card */
.verdict-card {
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.verdict-card.high-risk {
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.3);
}
.verdict-card.low-risk {
  background: rgba(16,185,129,0.08);
  border: 1px solid rgba(16,185,129,0.3);
}
.verdict-card.medium-risk {
  background: rgba(245,158,11,0.08);
  border: 1px solid rgba(245,158,11,0.3);
}
.verdict-icon {
  font-size: 48px;
}
.verdict-info {
  flex: 1;
}
.verdict-badge {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.verdict-title {
  font-size: 24px;
  font-weight: 800;
  margin: 4px 0 6px;
}
.verdict-desc {
  font-size: 13px;
  color: var(--text-secondary);
}
.verdict-score {
  text-align: center;
  min-width: 100px;
}
.score-circle {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-tertiary);
  border: 2px solid var(--accent);
}
.score-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
}

/* Confidence section */
.conf-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.conf-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}
.conf-track {
  height: 6px;
  background: var(--bg-tertiary);
  border-radius: 99px;
  overflow: hidden;
}
.conf-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  width: 0;
}

/* Metric cards */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.metric-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: var(--transition);
}
.metric-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.metric-name {
  font-weight: 700;
  font-size: 14px;
}
.metric-badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
}
.badge-high {
  background: rgba(239,68,68,0.12);
  color: var(--error);
}
.badge-medium {
  background: rgba(245,158,11,0.12);
  color: var(--warning);
}
.badge-low {
  background: rgba(16,185,129,0.12);
  color: var(--success);
}
.metric-score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 12px;
}
.metric-bar {
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 99px;
  margin: 12px 0;
  overflow: hidden;
}
.metric-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.6s ease;
  width: 0;
}
.metric-interpretation {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-secondary);
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

/* Details tab */
.details-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.detail-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  text-align: center;
}
.detail-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}
.detail-label {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 6px;
}
.timeline {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.timeline-row {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.timeline-row:last-child {
  border-bottom: none;
}
.timeline-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.timeline-label {
  flex: 1;
  font-size: 12px;
  color: var(--text-secondary);
}
.timeline-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-primary);
}

/* Settings overlay */
#settings-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
#settings-overlay.visible {
  display: flex;
}
.settings-modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 420px;
}
.settings-modal h3 {
  font-size: 18px;
  margin-bottom: 20px;
}
.settings-field {
  margin-bottom: 16px;
}
.settings-field label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  display: block;
  margin-bottom: 6px;
}
.settings-field input {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-primary);
}
.settings-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}
.btn-secondary, .btn-primary {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}
.btn-secondary {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-primary);
}
.btn-primary {
  background: var(--accent);
  border: none;
  color: white;
}

/* Theme toggle */
.theme-toggle {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #4f47e6;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div id="titlebar">
  <div class="brand">
    <div class="brand-icon"></div> 
    <div class="brand-text">Intelli <span>Trace</span></div>
  </div>
  <div style="display: flex; gap: 12px; -webkit-app-region: no-drag;">
    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
    <div class="window-controls">
      <button class="win-btn" id="minimizeBtn"><svg viewBox="0 0 10 2"><line x1="0" y1="1" x2="10" y2="1" stroke-width="1.5"/></svg></button>
      <button class="win-btn" id="maximizeBtn"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" stroke-width="1.5"/></svg></button>
      <button class="win-btn close" id="closeBtn"><svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke-width="1.5"/><line x1="9" y1="1" x2="1" y2="9" stroke-width="1.5"/></svg></button>
    </div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-content">
      <div>
        <div class="section-label">Target</div>
        <div class="input-group">
          <span class="input-prefix">r/</span>
          <input id="username-input" type="text" placeholder="username" autocomplete="off" />
        </div>
        <button id="scan-btn">Run Analysis</button>
      </div>
      <div>
        <div class="section-label">Pipeline</div>
        <div class="pipeline-list">
          <div class="pipeline-item" data-stage="scraping"><div class="pipeline-num">1</div><span class="pipeline-name">Data Collection</span><div class="pipeline-spinner"></div></div>
          <div class="pipeline-item" data-stage="ideology"><div class="pipeline-num">2</div><span class="pipeline-name">Ideology Model</span><div class="pipeline-spinner"></div></div>
          <div class="pipeline-item" data-stage="aigen"><div class="pipeline-num">3</div><span class="pipeline-name">AI Text Detection</span><div class="pipeline-spinner"></div></div>
          <div class="pipeline-item" data-stage="frequency"><div class="pipeline-num">4</div><span class="pipeline-name">Frequency Analysis</span><div class="pipeline-spinner"></div></div>
          <div class="pipeline-item" data-stage="rhythm"><div class="pipeline-num">5</div><span class="pipeline-name">Rhythm Analysis</span><div class="pipeline-spinner"></div></div>
          <div class="pipeline-item" data-stage="done"><div class="pipeline-num">✓</div><span class="pipeline-name">Complete</span><div class="pipeline-spinner"></div></div>
        </div>
      </div>
      <div class="sidebar-footer">
        <button class="footer-btn" id="settings-toggle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>API Settings</button>
        <button class="footer-btn" id="clear-btn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>Clear</button>
      </div>
    </div>
  </aside>

  <main id="main-content">
    <div id="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">Reddit Bot Detection</div>
      <div class="empty-desc">Enter a username to analyze ideology, AI text patterns, frequency, and posting rhythm.</div>
    </div>
    <div id="log-panel"></div>
    <div id="result-panel">
      <div class="tab-bar"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="details">Account Details</button></div>
      <div class="tab-pane active" id="tab-summary">
        <div id="verdict-container"></div>
        <div class="conf-section"><div class="conf-header"><span>Overall Bot Probability</span><span id="conf-percent">0%</span></div><div class="conf-track"><div class="conf-fill" id="conf-fill-bar"></div></div></div>
        <div class="metrics-grid" id="metrics-grid"></div>
      </div>
      <div class="tab-pane" id="tab-details">
        <div class="details-grid" id="details-grid"></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
    <div id="settings-overlay"><div class="settings-modal"><h3>API Configuration</h3><div class="settings-field"><label>Base URL</label><input id="cfg-url" type="text" placeholder="http://localhost:8000" /></div><div class="settings-field"><label>API Key</label><input id="cfg-key" type="password" placeholder="your-api-key" /></div><div class="settings-actions"><button class="btn-secondary" id="settings-cancel">Cancel</button><button class="btn-primary" id="settings-save">Save</button></div></div></div>
  </main>
</div>

<script>
// Theme handling
let isDark = true;
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeToggle.textContent = isDark ? '🌙 Dark' : '☀️ Light';
});

// DOM elements
const usernameInput = document.getElementById('username-input');
const scanBtn = document.getElementById('scan-btn');
const emptyState = document.getElementById('empty-state');
const logPanel = document.getElementById('log-panel');
const resultPanel = document.getElementById('result-panel');
const settingsOverlay = document.getElementById('settings-overlay');
const cfgUrl = document.getElementById('cfg-url');
const cfgKey = document.getElementById('cfg-key');

let scanning = false;

const stageElements = {
  scraping: document.querySelector('[data-stage="scraping"]'),
  ideology: document.querySelector('[data-stage="ideology"]'),
  aigen: document.querySelector('[data-stage="aigen"]'),
  frequency: document.querySelector('[data-stage="frequency"]'),
  rhythm: document.querySelector('[data-stage="rhythm"]'),
  done: document.querySelector('[data-stage="done"]'),
};

function setStage(name, state) {
  const el = stageElements[name];
  if (!el) return;
  el.classList.remove('active', 'done', 'error');
  if (state) el.classList.add(state);
}

function resetStages() {
  Object.keys(stageElements).forEach(k => setStage(k, null));
}

function log(text, type = 'info') {
  emptyState.style.display = 'none';
  logPanel.classList.add('visible');
  const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span class="log-time">[${ts}]</span><span class="log-level level-${type}">${type.toUpperCase()}</span><span class="log-message">${escapeHtml(text)}</span>`;
  logPanel.appendChild(div);
  logPanel.scrollTop = logPanel.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

function showPanel(panel) {
  emptyState.style.display = 'none';
  logPanel.classList.remove('visible');
  resultPanel.classList.remove('visible');
  if (panel === 'log') logPanel.classList.add('visible');
  if (panel === 'result') resultPanel.classList.add('visible');
  if (panel === 'empty') emptyState.style.display = 'flex';
}

function setBusy(busy) {
  scanning = busy;
  scanBtn.disabled = busy;
  usernameInput.disabled = busy;
  scanBtn.textContent = busy ? 'Scanning...' : 'Run Analysis';
}

// Settings handlers
document.getElementById('settings-toggle').addEventListener('click', () => settingsOverlay.classList.add('visible'));
document.getElementById('settings-cancel').addEventListener('click', () => settingsOverlay.classList.remove('visible'));
document.getElementById('settings-save').addEventListener('click', () => {
  settingsOverlay.classList.remove('visible');
  log('Settings saved', 'ok');
});
document.getElementById('clear-btn').addEventListener('click', () => {
  showPanel('empty');
  logPanel.innerHTML = '';
  resultPanel.innerHTML = '';
  resetStages();
});

// Tab switching
function initTabs() {
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      this.classList.add('active');
      document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
    });
  });
}

// Scan logic
scanBtn.addEventListener('click', startScan);
usernameInput.addEventListener('keypress', e => { if (e.key === 'Enter') startScan(); });

async function startScan() {
  const raw = usernameInput.value.trim().replace(/^u\//i, '');
  if (!raw || scanning) return;
  setBusy(true);
  resetStages();
  logPanel.innerHTML = '';
  resultPanel.innerHTML = '';
  showPanel('log');
  log(`Analyzing u/${raw}`, 'sys');

  setStage('scraping', 'active');
  log('Collecting user data...', 'info');
  await delay(700);
  setStage('scraping', 'done');
  log('Data collection complete', 'ok');

  setStage('ideology', 'active');
  log('Running ideology classification...', 'info');
  await delay(600);
  setStage('ideology', 'done');

  setStage('aigen', 'active');
  log('Detecting AI-generated text patterns...', 'info');
  await delay(650);
  setStage('aigen', 'done');

  setStage('frequency', 'active');
  log('Analyzing posting frequency...', 'info');
  await delay(500);
  setStage('frequency', 'done');

  setStage('rhythm', 'active');
  log('Analyzing posting rhythm patterns...', 'info');
  await delay(550);
  setStage('rhythm', 'done');

  setStage('done', 'done');
  log('Analysis complete', 'ok');

  // Dynamic result data with realistic values
  const result = {
    username: raw,
    overall_probability: 0.73,
    ideology: { score: 0.82, interpretation: "High ideological consistency suggests potential agenda-driven posting patterns." },
    ai_text: { score: 0.64, interpretation: "Moderate AI-like patterns — language shows unusual coherence and low perplexity." },
    frequency: { score: 0.88, interpretation: "Posting volume exceeds human baseline — 12+ posts/hour sustained." },
    rhythm: { score: 0.58, interpretation: "Mixed rhythm patterns — some intervals show mechanical regularity." }
  };
  renderResult(result);
  setBusy(false);
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function renderResult(data) {
  resultPanel.innerHTML = `
    <div class="tab-bar"><button class="tab active" data-tab="summary">Summary</button><button class="tab" data-tab="details">Account Details</button></div>
    <div class="tab-pane active" id="tab-summary"><div id="verdict-container"></div><div class="conf-section"><div class="conf-header"><span>Overall Bot Probability</span><span id="conf-percent">0%</span></div><div class="conf-track"><div class="conf-fill" id="conf-fill-bar"></div></div></div><div class="metrics-grid" id="metrics-grid"></div></div>
    <div class="tab-pane" id="tab-details"><div class="details-grid" id="details-grid"></div><div class="timeline" id="timeline"></div></div>
  `;
  showPanel('result');

  const prob = data.overall_probability;
  const percent = Math.round(prob * 100);
  const isHighRisk = prob >= 0.65;
  const isMediumRisk = prob >= 0.4 && prob < 0.65;
  const riskClass = isHighRisk ? 'high-risk' : (isMediumRisk ? 'medium-risk' : 'low-risk');
  const verdictText = isHighRisk ? 'High Risk - Automated Account Likely' : (isMediumRisk ? 'Medium Risk - Mixed Signals' : 'Low Risk - Human Likely');

  document.getElementById('verdict-container').innerHTML = `
    <div class="verdict-card ${riskClass}">
      <div class="verdict-icon">${isHighRisk ? '🤖' : '👤'}</div>
      <div class="verdict-info">
        <div class="verdict-badge">DETECTION RESULT</div>
        <div class="verdict-title">${verdictText}</div>
        <div class="verdict-desc">u/${escapeHtml(data.username)} — ${percent}% bot probability across all models</div>
      </div>
      <div class="verdict-score"><div class="score-circle"><div class="score-value">${percent}%</div></div></div>
    </div>
  `;

  document.getElementById('conf-percent').innerText = percent + '%';
  const fillColor = isHighRisk ? '#ef4444' : (isMediumRisk ? '#f59e0b' : '#10b981');
  setTimeout(() => {
    const bar = document.getElementById('conf-fill-bar');
    if (bar) { bar.style.width = percent + '%'; bar.style.background = fillColor; }
  }, 50);

  const metrics = [
    { name: 'Ideology', score: data.ideology.score, color: '#ef4444', interpretation: data.ideology.interpretation },
    { name: 'AI Text', score: data.ai_text.score, color: '#f59e0b', interpretation: data.ai_text.interpretation },
    { name: 'Frequency', score: data.frequency.score, color: '#ef4444', interpretation: data.frequency.interpretation },
    { name: 'Rhythm', score: data.rhythm.score, color: '#10b981', interpretation: data.rhythm.interpretation }
  ];

  const metricsGrid = document.getElementById('metrics-grid');
  metricsGrid.innerHTML = metrics.map(m => {
    const scorePct = Math.round(m.score * 100);
    const badgeClass = m.score >= 0.7 ? 'badge-high' : (m.score >= 0.4 ? 'badge-medium' : 'badge-low');
    const badgeText = m.score >= 0.7 ? 'Elevated' : (m.score >= 0.4 ? 'Moderate' : 'Low');
    return `
      <div class="metric-card">
        <div class="metric-header">
          <span class="metric-name">${m.name}</span>
          <span class="metric-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="metric-score">${scorePct}%</div>
        <div class="metric-bar"><div class="metric-bar-fill" data-width="${scorePct}" style="background:${m.color}"></div></div>
        <div class="metric-interpretation">${m.interpretation}</div>
      </div>
    `;
  }).join('');

  setTimeout(() => {
    document.querySelectorAll('.metric-bar-fill').forEach(el => {
      const w = el.getAttribute('data-width');
      if (w) el.style.width = w + '%';
    });
  }, 100);

  document.getElementById('details-grid').innerHTML = `
    <div class="detail-card"><div class="detail-value">1,247</div><div class="detail-label">Posts</div></div>
    <div class="detail-card"><div class="detail-value">3,892</div><div class="detail-label">Comments</div></div>
    <div class="detail-card"><div class="detail-value">184d</div><div class="detail-label">Account Age</div></div>
    <div class="detail-card"><div class="detail-value">14.2</div><div class="detail-label">Avg Posts/Day</div></div>
    <div class="detail-card"><div class="detail-value">9</div><div class="detail-label">Subreddits</div></div>
    <div class="detail-card"><div class="detail-value">24.6k</div><div class="detail-label">Karma</div></div>
  `;

  document.getElementById('timeline').innerHTML = `
    <div class="timeline-row"><div class="timeline-dot" style="background:#3b82f6"></div><span class="timeline-label">Data Collection</span><span class="timeline-value">1.2s</span></div>
    <div class="timeline-row"><div class="timeline-dot" style="background:#8b5cf6"></div><span class="timeline-label">Ideology Model</span><span class="timeline-value">0.9s</span></div>
    <div class="timeline-row"><div class="timeline-dot" style="background:#f59e0b"></div><span class="timeline-label">AI Text Detection</span><span class="timeline-value">1.1s</span></div>
    <div class="timeline-row"><div class="timeline-dot" style="background:#10b981"></div><span class="timeline-label">Frequency Analysis</span><span class="timeline-value">0.5s</span></div>
    <div class="timeline-row"><div class="timeline-dot" style="background:#ef4444"></div><span class="timeline-label">Rhythm Analysis</span><span class="timeline-value">0.6s</span></div>
  `;

  initTabs();
}

// Window controls
if (window.electronAPI) {
  document.getElementById('minimizeBtn')?.addEventListener('click', () => window.electronAPI.minimize());
  document.getElementById('maximizeBtn')?.addEventListener('click', () => window.electronAPI.maximize());
  document.getElementById('closeBtn')?.addEventListener('click', () => window.electronAPI.close());
}
</script>
</body>
</html>
