<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reddit Bot Detector</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #080a0e;
  --surface:   #0f1117;
  --surface2:  #171b24;
  --border:    #1e2433;
  --border2:   #2a3145;
  --text:      #c9d1e0;
  --muted:     #4a5568;
  --accent:    #f0a500;
  --accent2:   #e07b00;
  --green:     #22d3a0;
  --red:       #f5425a;
  --blue:      #4b9eff;
  --purple:    #a78bfa;
  --radius:    10px;
  --mono:      "JetBrains Mono", monospace;
  --sans:      "Syne", sans-serif;
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

/* ── TITLEBAR ────────────────────────────────────────────── */
#titlebar {
  -webkit-app-region: drag;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  height: 38px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#titlebar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}

#titlebar .brand .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 2s infinite;
}

#titlebar .controls {
  -webkit-app-region: no-drag;
  display: flex;
  gap: 6px;
}

#titlebar .controls button {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--surface2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
}
#titlebar .controls button:hover { background: var(--border2); transform: scale(1.08); }
#titlebar .controls .btn-close:hover { background: var(--red); }
#titlebar .controls svg { width: 10px; height: 10px; stroke: var(--muted); }
#titlebar .controls .btn-close:hover svg { stroke: #fff; }

/* ── LAYOUT ──────────────────────────────────────────────── */
#app {
  flex: 1;
  display: grid;
  grid-template-columns: 260px 1fr;
  overflow: hidden;
}

/* ── LEFT PANEL ──────────────────────────────────────────── */
#sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 16px;
  gap: 20px;
  overflow-y: auto;
}

.sidebar-section { display: flex; flex-direction: column; gap: 10px; }

.label {
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

/* Input */
#username-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
#username-input:focus { border-color: var(--accent); }
#username-input::placeholder { color: var(--muted); }

/* Scan button */
#scan-btn {
  width: 100%;
  padding: 11px 0;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  color: #000;
  cursor: pointer;
  transition: background .15s, transform .1s, box-shadow .2s;
}
#scan-btn:hover:not(:disabled) {
  background: var(--accent2);
  box-shadow: 0 0 20px rgba(240,165,0,.3);
}
#scan-btn:active:not(:disabled) { transform: scale(.98); }
#scan-btn:disabled { opacity: .45; cursor: not-allowed; }

/* Stage list */
.stage-list { display: flex; flex-direction: column; gap: 6px; }

.stage {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  transition: border-color .3s, color .3s, background .3s;
}
.stage.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(240,165,0,.07);
}
.stage.done {
  border-color: var(--green);
  color: var(--green);
  background: rgba(34,211,160,.06);
}
.stage.error {
  border-color: var(--red);
  color: var(--red);
  background: rgba(245,66,90,.06);
}

.stage-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 10px;
  transition: background .3s;
}
.stage.active .stage-icon { background: var(--accent); animation: pulse 1.2s infinite; }
.stage.done  .stage-icon { background: var(--green); animation: none; }
.stage.error .stage-icon { background: var(--red); animation: none; }

/* Settings gear */
#settings-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  transition: border-color .2s, color .2s;
  margin-top: auto;
}
#settings-toggle:hover { border-color: var(--border2); color: var(--text); }

/* ── RIGHT PANEL ─────────────────────────────────────────── */
#main-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Empty state */
#empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  opacity: .35;
}
#empty-state .big-icon { font-size: 52px; }
#empty-state p {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--muted);
}

/* Log terminal */
#log-panel {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  font-size: 11.5px;
  line-height: 1.8;
  display: none;
  flex-direction: column;
  gap: 2px;
}
#log-panel.visible { display: flex; }

.log-line { display: flex; gap: 10px; }
.log-ts { color: var(--muted); flex-shrink: 0; }
.log-err { color: var(--red); }
.log-ok  { color: var(--green); }
.log-info{ color: var(--blue); }
.log-warn{ color: var(--accent); }

/* Result card */
#result-panel {
  padding: 0 24px 24px;
  overflow-y: auto;
  display: none;
  flex-direction: column;
  gap: 16px;
}
#result-panel.visible { display: flex; }

/* Verdict banner */
.verdict {
  border-radius: var(--radius);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.verdict.human {
  background: linear-gradient(120deg, rgba(34,211,160,.12), rgba(34,211,160,.04));
  border: 1px solid rgba(34,211,160,.3);
}
.verdict.bot {
  background: linear-gradient(120deg, rgba(245,66,90,.12), rgba(245,66,90,.04));
  border: 1px solid rgba(245,66,90,.3);
}
.verdict-icon { font-size: 36px; }
.verdict-title {
  font-family: var(--sans);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.01em;
}
.verdict.human .verdict-title { color: var(--green); }
.verdict.bot   .verdict-title { color: var(--red); }
.verdict-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* Probability bar */
.prob-bar-wrap { display: flex; flex-direction: column; gap: 6px; }
.prob-bar-track {
  height: 6px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
}
.prob-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 1.2s cubic-bezier(.22,1,.36,1);
}

/* Analysis grid */
.analysis-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.analysis-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text);
}
.card-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 99px;
  font-weight: 600;
}
.card-badge.human { background: rgba(34,211,160,.15); color: var(--green); }
.card-badge.bot   { background: rgba(245,66,90,.15);  color: var(--red);   }

.card-prob {
  font-family: var(--sans);
  font-size: 28px;
  font-weight: 800;
}
.card-desc {
  font-size: 10.5px;
  color: var(--muted);
  line-height: 1.7;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

/* Indicators */
.indicators { display: flex; flex-direction: column; gap: 4px; }
.indicator {
  font-size: 10px;
  color: var(--muted);
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 6px;
  align-items: flex-start;
  line-height: 1.5;
}
.indicator::before { content: "›"; color: var(--accent); flex-shrink: 0; }

/* ── SETTINGS OVERLAY ────────────────────────────────────── */
#settings-overlay {
  position: absolute;
  inset: 0;
  background: rgba(8,10,14,.92);
  backdrop-filter: blur(6px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 100;
}
#settings-overlay.visible { display: flex; }

.settings-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 28px;
  width: 400px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.settings-title {
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
}
.settings-field { display: flex; flex-direction: column; gap: 6px; }
.settings-field label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.settings-field input {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 9px 12px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.settings-field input:focus { border-color: var(--accent); }
.settings-btns { display: flex; gap: 10px; }
.settings-btns button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.settings-btns button:hover { opacity: .85; }
#settings-save { background: var(--accent); color: #000; }
#settings-cancel { background: var(--surface2); color: var(--text); }

/* ── ANIMATIONS ──────────────────────────────────────────── */
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(240,165,0,.4); }
  50%      { box-shadow: 0 0 0 5px rgba(240,165,0,0); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeIn .4s ease forwards; }

/* Scan ring on empty state */
.scan-ring {
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
}
</style>
</head>
<body>

<!-- ── TITLE BAR ──────────────────────────────────────────── -->
<div id="titlebar">
  <div class="brand">
    <div class="dot"></div>
    Reddit Bot Detector
  </div>
  <div class="controls">
    <button class="btn-minimize" title="Minimise" onclick="electronAPI.minimize()">
      <svg viewBox="0 0 10 2" fill="none"><line x1="0" y1="1" x2="10" y2="1" stroke-width="1.5"/></svg>
    </button>
    <button class="btn-maximize" title="Maximise" onclick="electronAPI.maximize()">
      <svg viewBox="0 0 10 10" fill="none"><rect x="1" y="1" width="8" height="8" stroke-width="1.5"/></svg>
    </button>
    <button class="btn-close" title="Close" onclick="electronAPI.close()">
      <svg viewBox="0 0 10 10" fill="none"><line x1="1" y1="1" x2="9" y2="9" stroke-width="1.5"/><line x1="9" y1="1" x2="1" y2="9" stroke-width="1.5"/></svg>
    </button>
  </div>
</div>

<!-- ── APP ────────────────────────────────────────────────── -->
<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-section">
      <span class="label">Target Username</span>
      <input id="username-input" type="text" placeholder="u/username" autocomplete="off" spellcheck="false" />
      <button id="scan-btn">⬡ Run Analysis</button>
    </div>

    <div class="sidebar-section">
      <span class="label">Pipeline Stages</span>
      <div class="stage-list">
        <div class="stage" data-stage="scraping">
          <div class="stage-icon">①</div>
          <span>Gathering data</span>
        </div>
        <div class="stage" data-stage="ideology">
          <div class="stage-icon">②</div>
          <span>Ideology model</span>
        </div>
        <div class="stage" data-stage="aigen">
          <div class="stage-icon">③</div>
          <span>AI text detection</span>
        </div>
        <div class="stage" data-stage="frequency">
          <div class="stage-icon">④</div>
          <span>Frequency model</span>
        </div>
        <div class="stage" data-stage="rhythm">
          <div class="stage-icon">⑤</div>
          <span>Rhythm analysis</span>
        </div>
        <div class="stage" data-stage="done">
          <div class="stage-icon">✓</div>
          <span>Complete</span>
        </div>
      </div>
    </div>

    <button id="settings-toggle" title="API settings">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      API Settings
    </button>
  </aside>

  <!-- MAIN PANEL -->
  <main id="main-panel">

    <!-- Empty state -->
    <div id="empty-state">
      <div class="scan-ring">🔍</div>
      <p>Enter a Reddit username to begin</p>
    </div>

    <!-- Log terminal -->
    <div id="log-panel"></div>

    <!-- Result -->
    <div id="result-panel"></div>

    <!-- Settings overlay -->
    <div id="settings-overlay">
      <div class="settings-card">
        <div class="settings-title">API Configuration</div>
        <div class="settings-field">
          <label>API Base URL</label>
          <input id="cfg-url" type="text" placeholder="http://localhost:8000" />
        </div>
        <div class="settings-field">
          <label>X-API-Key</label>
          <input id="cfg-key" type="password" placeholder="your-secret-key" />
        </div>
        <div class="settings-btns">
          <button id="settings-cancel">Cancel</button>
          <button id="settings-save">Save</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="renderer.js"></script>
</body>
</html>
